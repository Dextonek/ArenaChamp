<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <!-- Wave 3 hero concepts: Zephyr (sky, melee), Mortis (bone, summoner), Ada (clockwork). Front views, one scale.
       Drawn by hand as SVG; modelling reference for blender/heroes/hero_figures.py. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1a22"/><stop offset="1" stop-color="#0c0b10"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f6"/><stop offset="1" stop-color="#9fd8c6"/></linearGradient>
    <linearGradient id="grave" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6462"/><stop offset="1" stop-color="#1c2422"/></linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8955a"/><stop offset="1" stop-color="#8a4420"/></linearGradient>
  </defs>
  <rect width="1080" height="960" fill="url(#bg)"/>
  <text x="540" y="44" fill="#e9dcc6" font-family="Georgia,serif" font-size="28" text-anchor="middle">Wave 3 · concept</text>
  <line x1="40" y1="860" x2="1040" y2="860" stroke="#2a2833" stroke-width="2"/>

  <!-- ============ ZEPHYR (sky, melee) -->
  <g transform="translate(180,0)">
    <ellipse cx="0" cy="858" rx="95" ry="12" fill="#000" opacity="0.5"/>
    <!-- long mint scarf streaming to his left in the wind -->
    <path d="M-30,236 C-120,250 -170,300 -230,280 C-200,320 -150,330 -110,300 C-80,290 -50,280 -30,262 Z" fill="#7fe6c8"/>
    <path d="M-230,280 L-250,262 M-225,292 L-252,300" stroke="#7fe6c8" stroke-width="6" stroke-linecap="round"/>
    <!-- light wrap coat: white with mint panels, split skirt for running, slim legs and wrapped boots -->
    <path d="M-56,230 L-78,560 L-20,600 L-10,420 L10,420 L20,600 L78,560 L56,230 Z" fill="url(#mint)"/>
    <path d="M-20,236 L-30,560 L0,580 L30,560 L20,236 Z" fill="#eef3f6"/>
    <path d="M-52,400 L52,400" stroke="#0d2a2a" stroke-width="10"/>
    <path d="M-44,580 L-40,820 M40,580 L40,820" stroke="#2a4a48" stroke-width="30" stroke-linecap="round"/>
    <path d="M-44,760 L-40,820 M40,760 L40,820" stroke="#eef3f6" stroke-width="32" stroke-linecap="round"/>
    <!-- arms: right hand holds a slim curved sword low and back -->
    <path d="M-56,240 L-84,420 L-74,430 L-46,270 Z" fill="#9fd8c6"/>
    <path d="M56,240 L92,400 L104,396 L70,250 Z" fill="#9fd8c6"/>
    <path d="M100,400 C160,470 200,560 196,650" stroke="#eef3f6" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M100,400 C160,470 200,560 196,650" stroke="#7fe6c8" stroke-width="3" fill="none" filter="url(#glow)"/>
    <path d="M90,396 L112,404" stroke="#0d2a2a" stroke-width="8"/>
    <!-- wind crescents curling around the blade -->
    <path d="M140,470 C190,470 220,520 210,560 C200,520 170,500 140,470 Z" fill="#7fe6c8" opacity="0.7"/>
    <path d="M150,580 C200,600 210,650 190,680 C196,640 180,610 150,580 Z" fill="#e6fff6" opacity="0.6"/>
    <!-- head: young face, windswept pale-teal hair with a mint headband, light eyes -->
    <ellipse cx="0" cy="186" rx="34" ry="40" fill="#e6c4a2"/>
    <path d="M-38,180 C-40,130 20,120 40,150 C60,150 70,170 58,176 C70,190 50,196 42,186 C30,160 -10,150 -38,180 Z" fill="#bfe8de"/>
    <path d="M-36,170 L38,166" stroke="#7fe6c8" stroke-width="8"/>
    <path d="M40,168 C70,170 90,160 110,150" stroke="#7fe6c8" stroke-width="6" fill="none"/>
    <circle cx="-12" cy="190" r="4" fill="#7fe6c8" filter="url(#glow)"/><circle cx="12" cy="190" r="4" fill="#7fe6c8" filter="url(#glow)"/>
    <text x="0" y="900" fill="#7fe6c8" font-family="Georgia,serif" font-size="22" text-anchor="middle">Zephyr · sky · melee</text>
  </g>

  <!-- ============ MORTIS (bone, summoner) -->
  <g transform="translate(540,0)">
    <ellipse cx="0" cy="858" rx="110" ry="12" fill="#000" opacity="0.5"/>
    <!-- skull staff in his right hand -->
    <path d="M-110,840 L-120,150" stroke="#ece4d0" stroke-width="12" stroke-linecap="round"/>
    <g fill="#ece4d0" stroke="#3a2e22" stroke-width="2"><ellipse cx="-120" cy="132" rx="26" ry="24"/><rect x="-134" y="146" width="28" height="16" rx="4"/></g>
    <circle cx="-129" cy="132" r="6" fill="#3fd8b8" filter="url(#glow)"/><circle cx="-111" cy="132" r="6" fill="#3fd8b8" filter="url(#glow)"/>
    <!-- tall tattered grave robe, hood -->
    <path d="M-64,220 L-110,820 L-70,800 L-50,830 L-20,800 L10,834 L40,800 L70,830 L110,820 L64,220 Z" fill="url(#grave)"/>
    <path d="M-20,260 L-26,820 L26,820 L20,260 Z" fill="#2a4a44"/>
    <path d="M-60,420 L60,420" stroke="#3fd8b8" stroke-width="6" opacity="0.8"/>
    <!-- ribcage mantle over the chest -->
    <g fill="none" stroke="#ece4d0" stroke-width="9" stroke-linecap="round">
      <path d="M-8,250 C-60,260 -70,300 -50,330"/><path d="M8,250 C60,260 70,300 50,330"/>
      <path d="M-8,280 C-54,290 -62,320 -44,350"/><path d="M8,280 C54,290 62,320 44,350"/>
      <path d="M-8,310 C-46,318 -52,340 -38,366"/><path d="M8,310 C46,318 52,340 38,366"/>
    </g>
    <path d="M0,240 L0,380" stroke="#ece4d0" stroke-width="12"/>
    <!-- shoulder skulls -->
    <g fill="#ece4d0"><ellipse cx="-74" cy="236" rx="20" ry="18"/><ellipse cx="74" cy="236" rx="20" ry="18"/></g>
    <circle cx="-80" cy="236" r="4" fill="#3fd8b8" filter="url(#glow)"/><circle cx="68" cy="236" r="4" fill="#3fd8b8" filter="url(#glow)"/>
    <path d="M-64,240 L-110,440 L-96,446 L-56,270 Z" fill="#3a4442"/>
    <path d="M64,240 L104,440 L118,436 L76,250 Z" fill="#3a4442"/>
    <path d="M110,436 C120,420 140,440 128,456" stroke="#3fd8b8" stroke-width="8" fill="none" filter="url(#glow)"/>
    <!-- deep hood, gaunt grey face, soulfire eyes -->
    <path d="M-48,210 C-60,120 60,120 48,210 C30,170 -30,170 -48,210 Z" fill="#2a3230"/>
    <ellipse cx="0" cy="196" rx="28" ry="34" fill="#b8b2a4"/>
    <path d="M-48,210 C-52,160 -30,128 0,124 C30,128 52,160 48,210 L40,212 C36,170 -36,170 -40,212 Z" fill="#1c2422"/>
    <circle cx="-11" cy="194" r="6" fill="#3fd8b8" filter="url(#glow)"/><circle cx="11" cy="194" r="6" fill="#3fd8b8" filter="url(#glow)"/>
    <text x="0" y="900" fill="#3fd8b8" font-family="Georgia,serif" font-size="22" text-anchor="middle">Mortis · bone · summoner</text>
  </g>

  <!-- ============ ADA (clockwork) -->
  <g transform="translate(900,0)">
    <ellipse cx="0" cy="858" rx="95" ry="12" fill="#000" opacity="0.5"/>
    <!-- brass gear backpack behind the shoulders -->
    <g transform="translate(-60,250)"><circle r="40" fill="#c9a24a" stroke="#1a0f08" stroke-width="4"/><circle r="12" fill="#1a0f08"/>
      <g stroke="#c9a24a" stroke-width="10"><path d="M0,-50 L0,-38"/><path d="M0,50 L0,38"/><path d="M-50,0 L-38,0"/><path d="M50,0 L38,0"/><path d="M-35,-35 L-27,-27"/><path d="M35,35 L27,27"/><path d="M-35,35 L-27,27"/><path d="M35,-35 L27,-27"/></g></g>
    <g transform="translate(62,226)"><circle r="26" fill="#d9773a" stroke="#1a0f08" stroke-width="3"/><circle r="8" fill="#1a0f08"/></g>
    <!-- copper long coat over a dark vest, rolled sleeves -->
    <path d="M-58,226 L-90,800 L90,800 L58,226 Z" fill="url(#copper)"/>
    <path d="M-26,240 L-36,600 L36,600 L26,240 Z" fill="#2a1a10"/>
    <g fill="#d8dde2"><circle cx="-14" cy="300" r="5"/><circle cx="-14" cy="360" r="5"/><circle cx="-14" cy="420" r="5"/><circle cx="14" cy="300" r="5"/><circle cx="14" cy="360" r="5"/><circle cx="14" cy="420" r="5"/></g>
    <path d="M-56,460 L56,460" stroke="#1a0f08" stroke-width="12"/>
    <path d="M-90,800 L90,800" stroke="#1a0f08" stroke-width="5"/>
    <!-- arms: left wrist launcher with a spring and a cyan lens -->
    <path d="M-58,236 L-92,430 L-78,436 L-46,262 Z" fill="#b86030"/>
    <path d="M58,236 L94,420 L108,416 L72,246 Z" fill="#b86030"/>
    <rect x="-108" y="420" width="40" height="34" rx="6" fill="#c9a24a" stroke="#1a0f08" stroke-width="3"/>
    <path d="M-106,460 C-96,470 -86,454 -76,466 C-66,478 -58,462 -50,472" stroke="#d8dde2" stroke-width="5" fill="none"/>
    <circle cx="-88" cy="437" r="8" fill="#6affea" filter="url(#glow)"/>
    <path d="M-120,440 L-150,430 L-138,446 L-170,440" stroke="#6affea" stroke-width="3" fill="none" filter="url(#glow)"/>
    <!-- head: auburn bob, brass goggles pushed up, a smudge, cyan eyes -->
    <ellipse cx="0" cy="186" rx="33" ry="39" fill="#e6c4a2"/>
    <path d="M-38,196 C-44,130 44,130 38,196 L30,170 C10,154 -10,154 -30,170 Z" fill="#8a3a1a"/>
    <g fill="#c9a24a" stroke="#1a0f08" stroke-width="3"><circle cx="-14" cy="156" r="12"/><circle cx="14" cy="156" r="12"/></g>
    <circle cx="-14" cy="156" r="6" fill="#6affea"/><circle cx="14" cy="156" r="6" fill="#6affea"/>
    <circle cx="-11" cy="190" r="4" fill="#6affea"/><circle cx="11" cy="190" r="4" fill="#6affea"/>
    <text x="0" y="900" fill="#d9773a" font-family="Georgia,serif" font-size="22" text-anchor="middle">Ada · clockwork · control</text>
  </g>
</svg>
