<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <!-- Wave 2 hero concepts: Fenna (grove), Auriel (dawn), Marin (tide). Front views, one scale. Drawn by hand as SVG;
       modelling reference for blender/heroes/hero_figures.py. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1a22"/><stop offset="1" stop-color="#0c0b10"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cbf55"/><stop offset="1" stop-color="#2a5a22"/></linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6efe0"/><stop offset="1" stop-color="#d8cbb0"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd6f2"/><stop offset="1" stop-color="#0f5f86"/></linearGradient>
  </defs>
  <rect width="1080" height="960" fill="url(#bg)"/>
  <text x="540" y="44" fill="#e9dcc6" font-family="Georgia,serif" font-size="28" text-anchor="middle">Wave 2 · concept</text>
  <line x1="40" y1="860" x2="1040" y2="860" stroke="#2a2833" stroke-width="2"/>

  <!-- ============ FENNA (grove) -->
  <g transform="translate(180,0)">
    <ellipse cx="0" cy="858" rx="95" ry="12" fill="#000" opacity="0.5"/>
    <!-- living staff: a twisted branch with a flower at the top, in her right hand -->
    <path d="M-100,820 C-110,600 -90,420 -116,180" stroke="#6a4a2a" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M-116,180 C-140,150 -126,120 -110,130 C-96,110 -80,140 -96,160" stroke="#4caf50" stroke-width="6" fill="none"/>
    <g transform="translate(-112,138)"><g fill="#ff7ab8"><ellipse cx="0" cy="-16" rx="9" ry="16"/><ellipse cx="15" cy="-5" rx="9" ry="16" transform="rotate(72 15 -5)"/><ellipse cx="9" cy="13" rx="9" ry="16" transform="rotate(144 9 13)"/><ellipse cx="-9" cy="13" rx="9" ry="16" transform="rotate(216 -9 13)"/><ellipse cx="-15" cy="-5" rx="9" ry="16" transform="rotate(288 -15 -5)"/></g><circle r="6" fill="#ffe36a" filter="url(#glow)"/></g>
    <!-- leaf-green layered robe with a bark-cream underlayer; a vine spirals around her -->
    <path d="M-60,220 L-100,800 L100,800 L60,220 Z" fill="url(#leaf)"/>
    <path d="M-30,240 L-46,800 L46,800 L30,240 Z" fill="#e8dcc0"/>
    <path d="M-100,800 L100,800" stroke="#14260f" stroke-width="5"/>
    <path d="M-80,760 C40,720 -70,640 50,600 C-60,560 60,500 -50,460 C50,420 -40,360 40,320" stroke="#3a8a34" stroke-width="7" fill="none"/>
    <g fill="#5cbf55"><ellipse cx="-30" cy="742" rx="12" ry="5" transform="rotate(-30 -30 742)"/><ellipse cx="20" cy="620" rx="12" ry="5" transform="rotate(30 20 620)"/><ellipse cx="-20" cy="520" rx="12" ry="5" transform="rotate(-20 -20 520)"/><ellipse cx="10" cy="400" rx="12" ry="5" transform="rotate(25 10 400)"/></g>
    <path d="M-62,400 L62,400" stroke="#6a4a2a" stroke-width="12"/>
    <!-- leaf mantle over the shoulders -->
    <path d="M-80,226 C-60,300 60,300 80,226 C40,250 -40,250 -80,226 Z" fill="#3a8a34"/>
    <g fill="#5cbf55"><path d="M-80,226 L-104,260 L-70,246 Z"/><path d="M80,226 L104,260 L70,246 Z"/><path d="M-40,250 L-50,290 L-24,262 Z"/><path d="M40,250 L50,290 L24,262 Z"/></g>
    <path d="M-62,226 L-96,450 L-74,456 L-46,260 Z" fill="#2f6a28"/><path d="M62,226 L96,450 L74,456 L46,260 Z" fill="#2f6a28"/>
    <circle cx="-86" cy="470" r="11" fill="#d8b490"/><circle cx="86" cy="470" r="11" fill="#d8b490"/>
    <!-- head: auburn hair with small antler-branches and blossoms -->
    <path d="M-36,140 C-46,210 -54,260 -40,290 L40,290 C54,260 46,210 36,140 Z" fill="#8a4a2a"/>
    <ellipse cx="0" cy="150" rx="29" ry="36" fill="#d8b490"/>
    <path d="M-32,140 C-30,104 30,104 32,140 C20,122 -20,122 -32,140 Z" fill="#8a4a2a"/>
    <path d="M-22,112 L-40,70 M-34,86 L-52,78 M22,112 L40,70 M34,86 L52,78" stroke="#6a4a2a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-40" cy="70" r="6" fill="#ff7ab8"/><circle cx="40" cy="70" r="6" fill="#ff7ab8"/>
    <ellipse cx="-11" cy="152" rx="5" ry="3" fill="#7fe07a" filter="url(#glow)"/><ellipse cx="11" cy="152" rx="5" ry="3" fill="#7fe07a" filter="url(#glow)"/>
  </g>
  <g transform="translate(180,890)" font-family="sans-serif" text-anchor="middle">
    <text fill="#e9dcc6" font-size="18" font-family="Georgia,serif">Fenna · grove</text>
    <g transform="translate(-60,14)"><rect width="22" height="14" fill="#14260f"/><rect x="24" width="22" height="14" fill="#4caf50"/><rect x="48" width="22" height="14" fill="#ffe36a"/><rect x="72" width="22" height="14" fill="#e8dcc0"/><rect x="96" width="22" height="14" fill="#ff7ab8"/></g>
    <text y="48" fill="#8b8698" font-size="11">branch antlers · leaf mantle · spiral vine · blooming staff</text>
  </g>

  <!-- ============ AURIEL (dawn) -->
  <g transform="translate(540,0)">
    <ellipse cx="0" cy="858" rx="105" ry="12" fill="#000" opacity="0.5"/>
    <!-- hard-light halo of panels behind the head -->
    <circle cx="0" cy="150" r="78" fill="none" stroke="#f2b83c" stroke-width="6"/>
    <circle cx="0" cy="150" r="70" fill="none" stroke="#efe6d2" stroke-width="3"/>
    <g fill="#f2b83c" stroke="#3a2408" stroke-width="2"><path d="M0,60 L8,74 L0,88 L-8,74 Z"/><path d="M78,150 L64,158 L50,150 L64,142 Z" transform="rotate(-20 0 150)"/><path d="M-78,150 L-64,158 L-50,150 L-64,142 Z" transform="rotate(20 0 150)"/></g>
    <!-- hard-light sword in the right hand, kite shield on the left arm -->
    <path d="M-104,470 L-112,190 L-96,170 L-80,190 L-88,470 Z" fill="#f6efe0" stroke="#3a2408" stroke-width="3"/>
    <path d="M-96,180 L-96,460" stroke="#fffdf2" stroke-width="3" filter="url(#glow)"/>
    <path d="M-122,470 L-70,470" stroke="#c9a24a" stroke-width="10"/>
    <path d="M70,320 L130,330 L136,430 L100,500 L64,430 Z" fill="#f2b83c" stroke="#3a2408" stroke-width="4"/>
    <path d="M100,340 L100,480 M76,400 L124,400" stroke="#fffdf2" stroke-width="4" filter="url(#glow)"/>
    <!-- white and gold plate over a long white tabard -->
    <path d="M-66,220 L-96,800 L96,800 L66,220 Z" fill="url(#plate)"/>
    <path d="M-30,300 L-34,800 L34,800 L30,300 Z" fill="#f2b83c"/>
    <path d="M-10,320 L-10,780 L10,780 L10,320 Z" fill="#fffdf2" opacity="0.6"/>
    <path d="M-60,240 C-40,320 40,320 60,240 L50,360 L-50,360 Z" fill="#efe6d2" stroke="#c9a24a" stroke-width="3"/>
    <path d="M-62,420 L62,420" stroke="#c9a24a" stroke-width="12"/>
    <!-- pauldrons -->
    <path d="M-104,250 C-110,200 -60,190 -54,224 Z" fill="#f2b83c" stroke="#3a2408" stroke-width="3"/>
    <path d="M104,250 C110,200 60,190 54,224 Z" fill="#f2b83c" stroke="#3a2408" stroke-width="3"/>
    <path d="M-66,230 L-98,450 L-76,456 L-48,264 Z" fill="#d8cbb0"/><path d="M66,230 L98,450 L76,456 L48,264 Z" fill="#d8cbb0"/>
    <circle cx="-96" cy="470" r="11" fill="#c9a24a"/><circle cx="96" cy="470" r="11" fill="#c9a24a"/>
    <!-- head: short golden hair, calm face, sky-blue eyes -->
    <ellipse cx="0" cy="150" rx="29" ry="36" fill="#e6c8a8"/>
    <path d="M-32,148 C-36,100 36,100 32,148 C26,124 -26,124 -32,148 Z" fill="#e8c46a"/>
    <ellipse cx="-11" cy="152" rx="5" ry="3" fill="#7fd8ff" filter="url(#glow)"/><ellipse cx="11" cy="152" rx="5" ry="3" fill="#7fd8ff" filter="url(#glow)"/>
  </g>
  <g transform="translate(540,890)" font-family="sans-serif" text-anchor="middle">
    <text fill="#e9dcc6" font-size="18" font-family="Georgia,serif">Auriel · dawn</text>
    <g transform="translate(-60,14)"><rect width="22" height="14" fill="#3a2408"/><rect x="24" width="22" height="14" fill="#f2b83c"/><rect x="48" width="22" height="14" fill="#ffe7a0"/><rect x="72" width="22" height="14" fill="#efe6d2"/><rect x="96" width="22" height="14" fill="#7fd8ff"/></g>
    <text y="48" fill="#8b8698" font-size="11">panel halo · hard-light sword · kite shield · plate</text>
  </g>

  <!-- ============ MARIN (tide) -->
  <g transform="translate(900,0)">
    <ellipse cx="0" cy="858" rx="95" ry="12" fill="#000" opacity="0.5"/>
    <!-- water sashes swirling around her, foam on the leading edges -->
    <path d="M-60,300 C-170,360 -120,520 -40,560 C40,600 160,560 150,460" stroke="url(#water)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M150,460 C150,440 140,430 130,428" stroke="#eaf8fb" stroke-width="10" stroke-linecap="round"/>
    <path d="M60,640 C150,660 150,760 60,780 C-30,800 -140,760 -150,700" stroke="url(#water)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M-150,700 C-152,690 -146,680 -138,676" stroke="#eaf8fb" stroke-width="8" stroke-linecap="round"/>
    <g fill="#bff2ff"><circle cx="-160" cy="440" r="5"/><circle cx="170" cy="420" r="4"/><circle cx="-168" cy="660" r="4"/></g>
    <!-- a flowing dancer's dress: deep teal with sea-glass layers, bare feet -->
    <path d="M-50,220 L-110,800 L110,800 L50,220 Z" fill="#0f5f86"/>
    <path d="M-30,420 L-80,800 L80,800 L30,420 Z" fill="#1f9fd6"/>
    <path d="M-110,800 C-60,780 -20,812 30,790 C70,776 90,800 110,800" stroke="#eaf8fb" stroke-width="6" fill="none"/>
    <path d="M-50,380 L50,380" stroke="#ff9a6a" stroke-width="10"/>
    <!-- bare shoulders, water rings on the wrists -->
    <path d="M-50,226 L-86,440 L-66,446 L-38,260 Z" fill="#c89878"/><path d="M50,226 L86,440 L66,446 L38,260 Z" fill="#c89878"/>
    <circle cx="-76" cy="430" r="14" fill="none" stroke="#bff2ff" stroke-width="5"/><circle cx="76" cy="430" r="14" fill="none" stroke="#bff2ff" stroke-width="5"/>
    <circle cx="-78" cy="462" r="10" fill="#c89878"/><circle cx="78" cy="462" r="10" fill="#c89878"/>
    <!-- head: long sea-green braid flowing to one side, coral clip, sea eyes -->
    <path d="M20,150 C70,200 70,300 110,360" stroke="#2a8a7a" stroke-width="16" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="150" rx="28" ry="35" fill="#c89878"/>
    <path d="M-30,146 C-30,104 30,100 34,142 C20,120 -18,120 -30,146 Z" fill="#2a8a7a"/>
    <circle cx="26" cy="118" r="7" fill="#ff9a6a"/>
    <ellipse cx="-11" cy="152" rx="5" ry="3" fill="#7fe8ff" filter="url(#glow)"/><ellipse cx="11" cy="152" rx="5" ry="3" fill="#7fe8ff" filter="url(#glow)"/>
  </g>
  <g transform="translate(900,890)" font-family="sans-serif" text-anchor="middle">
    <text fill="#e9dcc6" font-size="18" font-family="Georgia,serif">Marin · tide</text>
    <g transform="translate(-60,14)"><rect width="22" height="14" fill="#05253a"/><rect x="24" width="22" height="14" fill="#1f9fd6"/><rect x="48" width="22" height="14" fill="#bff2ff"/><rect x="72" width="22" height="14" fill="#eaf8fb"/><rect x="96" width="22" height="14" fill="#ff9a6a"/></g>
    <text y="48" fill="#8b8698" font-size="11">water sashes · wrist rings · sea braid · coral clip</text>
  </g>
</svg>
