<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960">
  <!-- Wave 4 hero concepts: Opaline (prism, mage), Sirix (hive, melee), Cantor (bard, support). Front views, one scale.
       Drawn by hand as SVG; modelling reference for blender/heroes/hero_figures.py. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1a22"/><stop offset="1" stop-color="#0c0b10"/></linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f4ff"/><stop offset="1" stop-color="#9a90e0"/></linearGradient>
    <linearGradient id="chitin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2010"/><stop offset="1" stop-color="#0c0904"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c03a8a"/><stop offset="1" stop-color="#5a1a4a"/></linearGradient>
  </defs>
  <rect width="1080" height="960" fill="url(#bg)"/>
  <text x="540" y="44" fill="#e9dcc6" font-family="Georgia,serif" font-size="28" text-anchor="middle">Wave 4 · concept</text>
  <line x1="40" y1="860" x2="1040" y2="860" stroke="#2a2833" stroke-width="2"/>

  <!-- ============ OPALINE (prism, mage) -->
  <g transform="translate(180,0)">
    <ellipse cx="0" cy="858" rx="95" ry="12" fill="#000" opacity="0.5"/>
    <!-- ring of small floating prisms behind her head -->
    <g fill="#b8b0ff" stroke="#14102a" stroke-width="2">
      <path d="M-70,150 L-60,130 L-50,150 L-60,170 Z"/><path d="M70,150 L80,130 L90,150 L80,170 Z"/>
      <path d="M-40,100 L-30,80 L-20,100 L-30,120 Z"/><path d="M40,100 L50,80 L60,100 L50,120 Z"/>
      <path d="M-6,84 L4,64 L14,84 L4,104 Z"/>
    </g>
    <path d="M-30,80 L-24,86 M50,80 L56,74" stroke="#5ab8ff" stroke-width="2"/>
    <!-- long pale lavender robe with a white underlayer and a high collar -->
    <path d="M-58,224 L-96,810 L96,810 L58,224 Z" fill="url(#lav)"/>
    <path d="M-24,240 L-34,810 L34,810 L24,240 Z" fill="#f0f4ff"/>
    <path d="M-56,420 L56,420" stroke="#14102a" stroke-width="8"/>
    <path d="M-96,810 L96,810" stroke="#14102a" stroke-width="5"/>
    <!-- spectral hem bands -->
    <g stroke-width="3"><path d="M-90,790 L90,790" stroke="#ff5a6a"/><path d="M-91,796 L91,796" stroke="#ffd24a"/><path d="M-92,802 L92,802" stroke="#5ab8ff"/></g>
    <!-- crystal epaulettes -->
    <g fill="#b8b0ff" stroke="#14102a" stroke-width="3"><path d="M-62,222 L-96,200 L-80,236 Z"/><path d="M-60,228 L-86,256 L-62,250 Z"/><path d="M62,222 L96,200 L80,236 Z"/><path d="M60,228 L86,256 L62,250 Z"/></g>
    <!-- arms; crystal-tipped wand in her right hand -->
    <path d="M-58,236 L-90,430 L-76,436 L-46,262 Z" fill="#c8c0f0"/>
    <path d="M58,236 L90,430 L104,426 L70,246 Z" fill="#c8c0f0"/>
    <path d="M-84,430 L-120,330" stroke="#14102a" stroke-width="7" stroke-linecap="round"/>
    <path d="M-120,330 L-132,296 L-118,276 L-106,300 Z" fill="#f0f4ff" stroke="#14102a" stroke-width="3" filter="url(#glow)"/>
    <!-- head: pale platinum bob, lavender eyes -->
    <ellipse cx="0" cy="186" rx="32" ry="38" fill="#ecd6c6"/>
    <path d="M-36,200 C-42,134 42,134 36,200 L28,166 C8,150 -8,150 -28,166 Z" fill="#e8e4f4"/>
    <circle cx="-11" cy="190" r="4" fill="#b8b0ff" filter="url(#glow)"/><circle cx="11" cy="190" r="4" fill="#b8b0ff" filter="url(#glow)"/>
    <text x="0" y="900" fill="#b8b0ff" font-family="Georgia,serif" font-size="22" text-anchor="middle">Opaline · prism · mage</text>
  </g>

  <!-- ============ SIRIX (hive, melee) -->
  <g transform="translate(540,0)">
    <ellipse cx="0" cy="858" rx="115" ry="12" fill="#000" opacity="0.5"/>
    <!-- translucent wing cloak behind -->
    <path d="M-30,240 C-150,260 -170,480 -120,640 C-90,520 -60,380 -30,300 Z" fill="#f6e6b0" opacity="0.35"/>
    <path d="M30,240 C150,260 170,480 120,640 C90,520 60,380 30,300 Z" fill="#f6e6b0" opacity="0.35"/>
    <!-- broad chitin armour, black with amber stripes on the abdomen-like skirt -->
    <path d="M-80,230 L-90,520 L-70,820 L70,820 L90,520 L80,230 Z" fill="url(#chitin)"/>
    <g stroke="#f0b020" stroke-width="10"><path d="M-84,560 L84,560"/><path d="M-80,640 L80,640"/><path d="M-76,720 L76,720"/></g>
    <!-- hexagon chest plates -->
    <g fill="#f0b020" stroke="#120e06" stroke-width="3" opacity="0.9">
      <path d="M-30,280 L-15,272 L0,280 L0,298 L-15,306 L-30,298 Z"/><path d="M0,280 L15,272 L30,280 L30,298 L15,306 L0,298 Z"/>
      <path d="M-15,306 L0,298 L15,306 L15,324 L0,332 L-15,324 Z"/>
    </g>
    <!-- hexagonal pauldrons -->
    <g fill="#2a2010" stroke="#f0b020" stroke-width="4"><path d="M-80,214 L-112,226 L-118,262 L-90,280 L-66,256 Z"/><path d="M80,214 L112,226 L118,262 L90,280 L66,256 Z"/></g>
    <!-- arms ending in serrated claw gauntlets -->
    <path d="M-86,260 L-114,450 L-96,456 L-70,290 Z" fill="#1c1608"/>
    <path d="M86,260 L114,450 L132,446 L100,280 Z" fill="#1c1608"/>
    <g fill="#f0b020" stroke="#120e06" stroke-width="3">
      <path d="M-112,450 L-140,520 L-118,500 L-112,530 L-100,496 L-96,456 Z"/>
      <path d="M114,446 L142,516 L120,496 L114,526 L102,492 L132,446 Z"/>
    </g>
    <!-- crested insect helm, amber eye lenses -->
    <path d="M-40,210 C-50,140 50,140 40,210 Z" fill="#1c1608"/>
    <path d="M0,140 C10,110 30,100 40,96 C30,112 20,130 12,146 Z" fill="#f0b020"/>
    <path d="M0,140 C-10,110 -30,100 -40,96 C-30,112 -20,130 -12,146 Z" fill="#f0b020"/>
    <ellipse cx="-16" cy="184" rx="12" ry="9" fill="#ffd24a" filter="url(#glow)"/><ellipse cx="16" cy="184" rx="12" ry="9" fill="#ffd24a" filter="url(#glow)"/>
    <path d="M-20,206 L-10,222 M20,206 L10,222" stroke="#f0b020" stroke-width="4"/>
    <!-- a few wasps -->
    <g fill="#f0b020"><ellipse cx="-150" cy="300" rx="9" ry="5"/><ellipse cx="160" cy="360" rx="9" ry="5"/><ellipse cx="-170" cy="420" rx="8" ry="4"/></g>
    <text x="0" y="900" fill="#f0b020" font-family="Georgia,serif" font-size="22" text-anchor="middle">Sirix · hive · melee</text>
  </g>

  <!-- ============ CANTOR (bard, support) -->
  <g transform="translate(900,0)">
    <ellipse cx="0" cy="858" rx="95" ry="12" fill="#000" opacity="0.5"/>
    <!-- parchment scarf with notes streaming to his left -->
    <path d="M-28,236 C-90,250 -130,290 -170,270 C-150,310 -110,316 -70,296 C-50,284 -36,272 -28,256 Z" fill="#f2e6d0"/>
    <g fill="#1e0a1a"><circle cx="-120" cy="284" r="5"/><path d="M-115,284 L-115,266" stroke="#1e0a1a" stroke-width="2"/><circle cx="-90" cy="282" r="5"/><path d="M-85,282 L-85,264" stroke="#1e0a1a" stroke-width="2"/></g>
    <!-- rose and plum long coat, open, over a cream shirt; tall boots -->
    <path d="M-54,228 L-82,720 L-20,740 L-12,420 L12,420 L20,740 L82,720 L54,228 Z" fill="url(#rose)"/>
    <path d="M-20,236 L-26,520 L26,520 L20,236 Z" fill="#f2e6d0"/>
    <path d="M-50,430 L50,430" stroke="#ffd24a" stroke-width="6"/>
    <path d="M-40,720 L-40,830 M40,720 L40,830" stroke="#2a0e22" stroke-width="30" stroke-linecap="round"/>
    <!-- arms; golden lyre held in his left arm -->
    <path d="M-54,240 L-86,420 L-72,426 L-44,266 Z" fill="#a03070"/>
    <path d="M54,240 L84,420 L98,416 L66,250 Z" fill="#a03070"/>
    <g transform="translate(110,400)" fill="none" stroke="#ffd24a" stroke-width="7" stroke-linecap="round">
      <path d="M-30,60 C-50,0 -40,-50 -20,-70"/><path d="M30,60 C50,0 40,-50 20,-70"/><path d="M-24,-56 L24,-56"/><path d="M-30,60 L30,60"/>
      <g stroke-width="2" stroke="#f2e6d0"><path d="M-12,-56 L-12,60"/><path d="M0,-56 L0,60"/><path d="M12,-56 L12,60"/></g>
    </g>
    <!-- head: dark curls, feathered wide hat, warm eyes -->
    <ellipse cx="0" cy="190" rx="31" ry="37" fill="#c8946c"/>
    <path d="M-34,196 C-40,150 40,150 34,196 L28,176 C10,166 -10,166 -28,176 Z" fill="#2a1410"/>
    <path d="M-70,160 C-40,140 40,140 70,160 C40,166 -40,166 -70,160 Z" fill="#5a1a4a"/>
    <path d="M-34,158 C-30,120 30,120 34,158 Z" fill="#5a1a4a"/>
    <path d="M20,140 C60,100 90,90 110,96 C80,104 60,120 34,146 Z" fill="#e04aa8"/>
    <circle cx="-11" cy="194" r="4" fill="#ffd24a"/><circle cx="11" cy="194" r="4" fill="#ffd24a"/>
    <text x="0" y="900" fill="#e04aa8" font-family="Georgia,serif" font-size="22" text-anchor="middle">Cantor · bard · support</text>
  </g>
</svg>
